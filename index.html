<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal</title>
<style>
  :root{
    --ink:#14171c; --panel:#1b1f27; --panel-hi:#232834; --hairline:#2c313d;
    --paper:#e9e6dd; --paper-dim:#9a9d9f; --brass:#e0a542; --teal:#4f9b90;
    --serif: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 90px;}
  header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--hairline);padding-bottom:16px;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
  header h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;}
  header .updated{font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);}
  .panel{background:var(--panel);border:1px solid var(--hairline);border-radius:3px;padding:14px 16px;margin-bottom:20px;}
  .panel h2{font-size:11px;color:var(--paper-dim);font-weight:500;margin:0 0 12px 0;letter-spacing:0.3px;}
  .dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 16px;}
  .dial-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .dial-label span:last-child{font-family:var(--mono);color:var(--brass);font-size:11px;}
  .dial-track{height:4px;background:var(--hairline);border-radius:2px;overflow:hidden;}
  .dial-fill{height:100%;background:var(--brass);transition:width 0.5s ease;}
  .feed{display:flex;flex-direction:column;gap:1px;background:var(--hairline);}
  .card{background:var(--panel);padding:16px;transition:background 0.2s;text-decoration:none;color:inherit;display:block;}
  .card:active,.card:hover{background:var(--panel-hi);}
  .card.read .headline{color:var(--paper-dim);}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);margin-bottom:6px;}
  .meta .topic{color:var(--teal);}
  .meta .dot{opacity:0.5;}
  .headline{font-family:var(--serif);font-size:17px;line-height:1.35;margin:0 0 4px 0;}
  .snippet{color:#c7c4ba;font-size:13.5px;line-height:1.5;margin:0;}
  .pct{font-family:var(--mono);font-size:10.5px;color:var(--brass);float:right;margin-left:8px;}
  .empty{padding:40px 16px;text-align:center;color:var(--paper-dim);font-size:13.5px;line-height:1.6;}
  .toast{
    position:fixed;left:16px;right:16px;bottom:16px;max-width:688px;margin:0 auto;
    background:var(--panel-hi);border:1px solid var(--brass);border-radius:4px;
    padding:12px 14px;font-family:var(--mono);font-size:11.5px;color:var(--brass);
    opacity:0;transform:translateY(8px);transition:opacity 0.3s,transform 0.3s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--hairline);font-size:11.5px;color:var(--paper-dim);line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Signal</h1>
    <div class="updated" id="updated">loading…</div>
  </header>

  <div class="panel">
    <h2>CALIBRATION</h2>
    <div class="dials" id="dials"></div>
  </div>

  <div class="feed" id="feed"><div class="empty">Loading today's articles…</div></div>

  <footer>
    Tap a headline to read it — it opens the source in a new tab. Signal tracks how long you're away and how often you return to a topic, and re-ranks tomorrow's feed accordingly. Your calibration lives only in this browser.
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "signal-weights-v1";
const READ_KEY = "signal-read-v1";

function loadWeights(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveWeights(w){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(w)); }catch(e){}
}
function loadRead(){
  try{
    const raw = localStorage.getItem(READ_KEY);
    if(raw) return new Set(JSON.parse(raw));
  }catch(e){}
  return new Set();
}
function saveRead(s){
  try{ localStorage.setItem(READ_KEY, JSON.stringify([...s])); }catch(e){}
}

let weights = loadWeights();
let readIds = loadRead();
let clickCounts = {};
let articles = [];

function weightFor(key){
  if(!(key in weights)) weights[key] = 0.3;
  return weights[key];
}

function score(a){
  return weightFor("topic:"+a.topic) * 0.65 + weightFor("source:"+a.source) * 0.35;
}

function renderDials(){
  const topics = [...new Set(articles.map(a=>a.topic))];
  const el = document.getElementById('dials');
  el.innerHTML = topics.map(t=>{
    const pct = Math.round(weightFor("topic:"+t)*100);
    return `<div><div class="dial-label"><span>${t}</span><span>${pct}</span></div>
      <div class="dial-track"><div class="dial-fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

function renderFeed(){
  const el = document.getElementById('feed');
  if(articles.length === 0){
    el.innerHTML = `<div class="empty">No articles in the last couple of days yet.<br>The daily refresh may not have run — trigger it manually from the Actions tab.</div>`;
    return;
  }
  const sorted = [...articles].sort((a,b)=>score(b)-score(a));
  el.innerHTML = sorted.map(a=>{
    const pct = Math.round(score(a)*100);
    const isRead = readIds.has(a.id);
    return `<a class="card ${isRead?'read':''}" href="${a.link}" target="_blank" rel="noopener"
        data-id="${a.id}" data-topic="${a.topic}" data-source="${a.source}" onclick="onOpen(this)">
      <span class="pct">${pct}</span>
      <div class="meta"><span class="topic">${a.topic}</span><span class="dot">·</span><span>${a.source}</span></div>
      <p class="headline">${a.title}</p>
      <p class="snippet">${a.summary || ''}</p>
    </a>`;
  }).join('');
}

let pendingOpen = null; // {id, topic, source, openedAt}

function onOpen(el){
  const id = el.dataset.id;
  pendingOpen = { id, topic: el.dataset.topic, source: el.dataset.source, openedAt: Date.now() };
  readIds.add(id);
  saveRead(readIds);
  // small immediate click signal
  weights["topic:"+el.dataset.topic] = Math.min(1, weightFor("topic:"+el.dataset.topic) + 0.05);
  weights["source:"+el.dataset.source] = Math.min(1, weightFor("source:"+el.dataset.source) + 0.05);
  clickCounts[el.dataset.topic] = (clickCounts[el.dataset.topic] || 0) + 1;
  saveWeights(weights);
  renderDials();
  renderFeed();
}

// when the user comes back to this tab after opening an article, treat the
// time away as a dwell-time proxy and reinforce accordingly.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && pendingOpen){
    const dwellSec = Math.round((Date.now() - pendingOpen.openedAt) / 1000);
    if(dwellSec >= 3){
      const dwellBoost = Math.min(0.25, (dwellSec/30) * 0.1);
      weights["topic:"+pendingOpen.topic] = Math.min(1, weightFor("topic:"+pendingOpen.topic) + dwellBoost);
      weights["source:"+pendingOpen.source] = Math.min(1, weightFor("source:"+pendingOpen.source) + dwellBoost*0.6);

      let freqBoost = 0;
      const n = clickCounts[pendingOpen.topic] || 0;
      if(n >= 2){
        freqBoost = 0.03 * (n - 1);
        weights["topic:"+pendingOpen.topic] = Math.min(1, weightFor("topic:"+pendingOpen.topic) + freqBoost);
      }
      saveWeights(weights);
      showToast(`${pendingOpen.topic} +${Math.round(dwellBoost*100)/100} (${dwellSec}s away)` + (freqBoost>0?` · +${Math.round(freqBoost*100)/100} frequency`:''));
      renderDials();
      renderFeed();
    }
    pendingOpen = null;
  }
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 3200);
}

fetch('./articles.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    articles = data.articles || [];
    document.getElementById('updated').textContent =
      'updated ' + new Date(data.generated_at).toLocaleString();
    renderDials();
    renderFeed();
  })
  .catch(() => {
    document.getElementById('feed').innerHTML =
      `<div class="empty">Couldn't load articles.json. Make sure the daily workflow has run at least once.</div>`;
  });
</script>
</body>
</html>

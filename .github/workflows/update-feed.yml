name: Refresh feed

on:
  schedule:
    # 12:00 UTC daily — adjust to whenever you want it ready each morning
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python fetch_feeds.py

      - name: Commit updated articles.json
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/articles.json
          git diff --staged --quiet || git commit -m "Refresh articles $(date -u +%Y-%m-%d)"
          git push
